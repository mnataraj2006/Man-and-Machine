<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="shell-type" content="web_standard" />
    <title>MAN & MACHINE FITNESS CENTRE | Kovilpatti</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var isDash = /^\/(admin|trainer|client|account)(\/|$)/.test(window.location.pathname);
          var resolved = 'dark';
          if (isDash) {
            var rawUser = localStorage.getItem('mm_auth_user');
            var user = rawUser ? JSON.parse(rawUser) : null;
            var pref = user && user.preferences && user.preferences.theme;
            if (!pref && user) {
              var uid = user.id || user._id;
              var mapRaw = localStorage.getItem('mm_user_themes');
              var map = mapRaw ? JSON.parse(mapRaw) : {};
              pref = uid ? map[uid] : null;
            }
            if (pref === 'light') {
              resolved = 'light';
            } else if (pref === 'system') {
              resolved =
                window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                  ? 'dark'
                  : 'light';
            }
          }
          document.documentElement.dataset.theme = resolved;
          if (resolved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body class="bg-[#090909] text-[#F5F5F5] antialiased selection:bg-[#EB3E2E] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
